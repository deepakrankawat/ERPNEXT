<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="color-scheme" content="light">
	<meta name="supported-color-schemes" content="light">
	<title>{{ title or "Lexocrates Communication" }}</title>
	<style type="text/css">
		:root { color-scheme: light; supported-color-schemes: light; }
		body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
		table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
		img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
		body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
		.email-container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; }
		.email-header { background: #0f172a; padding: 20px 32px; text-align: left; }
		.email-body { padding: 32px; color: #1e293b; font-size: 15px; line-height: 1.6; }
		.email-footer { background-color: #f8fafc; padding: 24px 32px; text-align: center; color: #64748b; font-size: 12px; border-top: 1px solid #e2e8f0; }
		a { color: #0284c7; text-decoration: none; }
		a:hover { text-decoration: underline; }
		.btn-primary { display: inline-block; background-color: #0284c7; color: #ffffff !important; padding: 12px 24px; font-weight: 600; border-radius: 6px; text-decoration: none; margin: 16px 0; }
		/* Gmail dark mode swaps colors on elements it flags with data-ogsc/data-ogsb,
		   which can turn the light footer buttons unreadable. Force them back. */
		[data-ogsc] .card-footer a, [data-ogsb] .card-footer a,
		[data-ogsc] .email-footer a, [data-ogsb] .email-footer a {
			background: #FFFFFF !important;
			color: #0B2545 !important;
			border-color: #CBD5E1 !important;
		}
	</style>
</head>
<body style="background-color: #f8fafc; margin: 0; padding: 24px 0;">
	<table border="0" cellpadding="0" cellspacing="0" width="100%">
		<tr>
			<td align="center" style="padding: 0 16px;">
				<div class="email-container" style="max-width: 600px; width: 100%; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; text-align: left;">
					
					<!-- Lexocrates Brand Header -->
					<div class="email-header" style="background-color: #0f172a; padding: 20px 32px; border-bottom: 3px solid #0284c7;">
						<table border="0" cellpadding="0" cellspacing="0" width="100%">
							<tr>
								<td valign="middle">
									<table border="0" cellpadding="0" cellspacing="0">
										<tr>
											<td style="vertical-align: middle;">
												<img src="{{ frappe.utils.get_url('/assets/lex/images/lexocrates-logo-light.svg') }}" alt="Lexocrates" width="160" style="display: block; width: 160px; max-width: 100%; height: auto;" />
											</td>
										</tr>
									</table>
								</td>
							</tr>
						</table>
					</div>

					<!-- Email Body Content -->
					<div class="email-body" style="padding: 32px; color: #1e293b; font-size: 15px; line-height: 1.6;">
						{{ content }}
					</div>

					<!-- Lexocrates Confidential Legal Footer -->
					<div class="email-footer" style="background-color: #f8fafc; padding: 24px 32px; border-top: 1px solid #e2e8f0; text-align: center; color: #64748b; font-size: 12px;">
						<p style="margin: 0 0 11px 0; font-weight: 700; color: #0f172a; font-size: 13px;">Lexocrates Legal Services</p>
						<table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center" style="margin: 0 auto 13px; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
							<tr>
								<td style="padding-right: 10px; white-space: nowrap;">
									<a href="https://www.lexocrates.com/" target="_blank" title="Lexocrates website" style="display: inline-block; white-space: nowrap; border: 1px solid #CBD5E1; border-radius: 4px; padding: 7px 11px; color: #0B2545; background: #FFFFFF; font-size: 12px; line-height: 18px; font-weight: bold; text-decoration: none;"><span aria-hidden="true" style="font-size: 14px; vertical-align: middle;">&#127760;</span> &nbsp;Website</a>
								</td>
								<td style="white-space: nowrap;">
									<a href="https://www.linkedin.com/company/lexocrates-legal-services-pvt-ltd/" target="_blank" title="Lexocrates on LinkedIn" style="display: inline-block; white-space: nowrap; border: 1px solid #CBD5E1; border-radius: 4px; padding: 7px 11px; color: #0B2545; background: #FFFFFF; font-size: 12px; line-height: 18px; font-weight: bold; text-decoration: none;"><span aria-hidden="true" style="font-size: 14px;">in</span> &nbsp;LinkedIn</a>
								</td>
							</tr>
						</table>
						<p style="margin: 0 0 4px 0; font-size: 10px; font-weight: bold; line-height: 15px; color: #6B7280;">Confidentiality Notice</p>
						<p style="margin: 0; font-size: 10px; line-height: 15px; color: #7A8492;">
							This email may contain confidential information. If you received it in error, please notify the sender and delete it.
						</p>
					</div>

				</div>
			</td>
		</tr>
	</table>
</body>
</html>
